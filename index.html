<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzakyGO Official - Home</title>
    <!-- Font Awesome untuk Icon Footer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* RESET & INITIAL STYLING */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            background-color: #000 !important;
            overflow-x: hidden;
            color: #fff;
        }

        /* FONT LOADER FROM GITHUB ASSETS */
        @font-face {
            font-family: 'MotoGP-Display';
            src: url('https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/MGPDisplay-BoldExpanded.otf') format('opentype');
            font-weight: bold;
        }

        @font-face {
            font-family: 'MotoGP-Text';
            src: url('https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/MGPText-Regular.ttf') format('truetype');
            font-weight: normal;
        }

        /* CORE NAVIGATION & SUBMENU */
        .main-nav {
            position: relative;
            z-index: 9999 !important;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #111;
            padding: 15px;
            border-bottom: 3px solid #379bff;
        }

        .main-nav .nav-link {
            color: #ffffff !important;
            text-decoration: none !important;
            font-family: 'MotoGP-Display', sans-serif !important;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .main-nav .nav-link:hover, 
        .submenu-link:hover {
            color: #379bff !important;
            opacity: 1 !important;
        }

        .eh-logo {
            font-family: 'MotoGP-Display', sans-serif;
            background: linear-gradient(90deg, #0000ff, #cc00cc);
            color: #fff !important;
            padding: 8px 20px !important;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 255, 0.4);
            cursor: pointer;
        }

        .submenu {
            display: none;
            background: #1a1a1a;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            border-bottom: 3px solid #ff37a1;
            z-index: 9998 !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .submenu p { 
            display: inline-block; 
            margin: 0 15px; 
        }

        .submenu-link {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 0.8rem;
        }

        .submenu-link:hover {
            color: #ff0000 !important;
            border-bottom: 1px solid #ff0000;
        }

        /* HERO SECTION */
        .hero-section {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            font-family: 'MotoGP-Display', sans-serif !important;
        }

        .hero-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .hero-logo {
            font-size: clamp(2.5rem, 10vw, 5rem) !important;
            line-height: 1.1 !important;
            margin: 0 !important;
            display: block;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 2px #379bff); }
            to { filter: drop-shadow(0 0 15px #ff37a1); }
        }

        .hero-subtitle {
            margin: 0 !important;
            padding: 10px 0;
            line-height: 1.4;
            display: block;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #379bff;
            text-align: center;
            letter-spacing: 4px;
        }

        .btn-start {
            padding: 15px 35px;
            background: linear-gradient(90deg, #379bff, #ff37a1);
            color: white;
            border: none;
            font-weight: bold;
            transform: skewX(-15deg);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* RESPONSIVE LAYOUT */
        @media screen and (max-width: 768px) {
            .main-nav {
                flex-direction: column;
                gap: 15px;
                padding: 10px;
            }

            .main-nav .nav-link {
                font-size: 0.8rem !important;
            }

            .eh-logo {
                order: -1;
                width: 90%;
                text-align: center;
            }

            .submenu {
                position: relative !important;
                top: 0 !important;
            }

            .submenu-link {
                display: block !important;
                margin: 10px 0 !important;
                font-size: 0.9rem !important;
            }
        }

        /* FOOTER BAR */
        .footer-bar {
            padding: 40px;
            text-align: center;
            color: #bbb;
            font-size: 0.8rem;
            border-top: 1px solid #333;
            background-color: #111;
        }

        .social-links {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .social-links a {
            color: #555;
            margin: 0 15px;
            transition: 0.3s;
            display: inline-block;
        }

        .social-links a:hover {
            color: #fff !important;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="main-nav">
        <a href="index.html" style="display: flex; align-items: center;">
            <div class="profile-logo-box">
                <img src="https://yt3.ggpht.com/U3JA2tnyay3U-wrA3DR27lKKBC5CkTechENg6CknuEoIOvZT9atx-5Bk9BSZ0ES4HWsyJK6ucw=s500" 
                     alt="DzakyGO Profile" 
                     style="height: 45px; width: auto; max-height: 45px; display: block; margin: 0;">
            </div>
        </a>

        <a href="index.html" class="nav-link">HOME</a>

        <div class="eh-logo nav-link" onclick="toggleSubmenu()">
            DZAKYGO
        </div>

        <a href="mods.html" class="nav-link">MODS</a>
        <a href="about.html" class="nav-link">ABOUT ME</a>
        
        <div id="eh-submenu" class="submenu">
            <p><a href="news.html" class="submenu-link">NEWS</a></p>
            <p><a href="https://aozorauniverse.blogspot.com" target="_blank" class="submenu-link">AOZORA UNIVERSE WEBSITE</a></p>
            <p><a href="https://dsc.gg/aozorians" target="_blank" class="submenu-link">AOZORA UNIVERSE DISCORD</a></p>
            <p><a href="https://youtube.com/@DzakyGO.2" target="_blank" class="submenu-link">DzakyGO Youtube</a></p>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="hero-section">
        <div class="hero-content-wrapper">
            <h1 class="hero-logo">AOZORA UNIVERSE</h1>
            <p class="hero-subtitle">WELCOME TO THE NEXT HORIZON</p>
            <a href="about.html" class="btn-start">EXPLORE NOW</a>
        </div>
    </div>

    <!-- FOOTER SECTION -->
    <footer class="footer-bar">
        <div class="social-links">
            <a href="https://dsc.gg/aozorians" target="_blank"><i class="fab fa-discord"></i></a>
            <a href="https://youtube.com/@DzakyGO.2" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com/@jakizulfah" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://tiktok.com/@dzaxuwu" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:icedzaky874@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
        <p style="margin: 0;">&copy; 2026 AOZORA UNIVERSE - DZAKYGO OFFICIAL PARTNER</p>
    </footer>

    <script>
        function toggleSubmenu() {
            var submenu = document.getElementById("eh-submenu");
            submenu.style.display = (submenu.style.display === "block") ? "none" : "block";
        }
        window.onclick = function(event) {
            if (!event.target.matches('.eh-logo')) {
                var submenu = document.getElementById("eh-submenu");
                if (submenu.style.display === "block") {
                    submenu.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
