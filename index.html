<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzakyGO Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- NAVIGASI KUSTOM SINKRON -->
    <nav class="main-nav">
        <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="https://yt3.ggpht.com/U3JA2tnyay3U-wrA3DR27lKKBC5CkTechENg6CknuEoIOvZT9atx-5Bk9BSZ0ES4HWsyJK6ucw=s500" alt="DzakyGO" style="height: 45px; width: auto;">
        </a>
        <a href="index.html" class="nav-link">HOME</a>
        <div class="eh-logo nav-link" onclick="toggleSubmenu()" style="cursor: pointer;">
            DZAKYGO NETWORK
        </div>
        <a href="https://dzakygodzax.blogspot.com/p/news.html" class="nav-link">MODS</a>
        <a href="about.html" class="nav-link">ABOUT ME</a>
        
        <!-- SUBMENU DROPDOWN FIX -->
        <div id="eh-submenu" class="submenu">
            <a href="https://dzakygodzax.blogspot.com/p/news.html" class="submenu-link">LATEST NEWS</a>
            <a href="https://aozorauniverse.blogspot.com" target="_blank" class="submenu-link">AOZORA WEBSITE</a>
            <a href="https://dsc.gg/aozorians" target="_blank" class="submenu-link">AOZORA DISCORD</a>
            <a href="https://youtube.com/@DzakyGO.2" target="_blank" class="submenu-link">YOUTUBE CHANNEL</a>
        </div>
    </nav>

    <!-- BANNER VIDEO YOUTUBE -->
    <section class="hero-youtube">
        <h2 class="hero-title"><i class="fab fa-youtube"></i> LATEST FROM <span>DZAKYGO</span></h2>
        <div class="video-wrapper">
            <!-- Ganti VIDEO_ID dengan ID video terbarumu -->
            <iframe src="https://www.youtube.com/embed/VIDEO_ID_KAMU" allowfullscreen></iframe>
        </div>
    </section>

    <!-- CONTENT WAIFU LIST -->
    <section class="character-container">
        <div style="text-align: center;">
            <h3 class="section-title">My Waifu 🥰</h3>
            <img src="https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/aori-chan.jpg" class="char-img" alt="Aori Aozora" style="max-width: 100%; height: auto; border-radius: 8px;">
            <div class="char-name">Aori Aozora</div>
            <div class="char-sub">-Aori-chan-</div>
        </div>

        <hr style="border:0; border-top:2px solid #222; margin:40px 0;">

        <h3 class="section-title" style="text-align: center;">Waifu List</h3>
        <div class="waifu-grid">
            <div class="grid-item">
                <img src="https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/kubo-nagisa.jpg" alt="Kubo Nagisa">
                <div class="char-name">Kubo Nagisa</div>
                <div class="char-sub">Kubo-san</div>
            </div>
            <div class="grid-item">
                <img src="https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/kobo-kanaeru.jpg" alt="Kobo Kanaeru">
                <div class="char-name">Kobo Kanaeru</div>
                <div class="char-sub">Kobo</div>
            </div>
            <div class="grid-item">
                <img src="https://raw.githubusercontent.com/dzakyzulfahmidzxy-lang/aozora-assets/main/vestia-zeta.jpg" alt="Vestia Zeta">
                <div class="char-name">Vestia Zeta</div>
                <div class="char-sub">Zeta</div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-bar">
        <p>&copy; 2026 AOZORA UNIVERSE - DZAKYGO OFFICIAL PARTNER</p>
    </footer>

    <script>
        function toggleSubmenu() {
            var submenu = document.getElementById("eh-submenu");
            if (submenu.style.display === "block" || submenu.style.style === "flex") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "block";
            }
        }
        // Menutup submenu jika user klik di luar menu
        window.onclick = function(event) {
            if (!event.target.matches('.eh-logo')) {
                var submenu = document.getElementById("eh-submenu");
                if (submenu.style.display === "block") {
                    submenu.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
